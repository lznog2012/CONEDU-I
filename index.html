<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contas da viagem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;700;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #EEF3F8;
  --card: #FFFFFF;
  --ink: #14213D;
  --ink-soft: #5B6B86;
  --line: #DCE4EE;
  --brand: #14213D;
  --brand-ink: #FFFFFF;
  --red: #C9243F;
  --red-bg: #FDECEF;
  --green: #12805A;
  --green-bg: #E5F6EE;
  --orange: #C2570C;
  --orange-bg: #FFF1E3;
  --ticket: #14213D;
  --ticket-ink: #F4F7FB;
  --ticket-soft: #A9B6CE;
  --shadow: 0 1px 2px rgba(20,33,61,.06), 0 6px 18px rgba(20,33,61,.07);
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1322; --card: #151F36; --ink: #EAF0FA; --ink-soft: #93A3C1; --line: #26334F;
    --brand: #EAF0FA; --brand-ink: #0C1322;
    --red: #FF7A8D; --red-bg: #3A1B28; --green: #3FDCA4; --green-bg: #11332B;
    --orange: #FFA94D; --orange-bg: #3A2614;
    --ticket: #1D2B4B; --ticket-ink: #F4F7FB; --ticket-soft: #9FB0D0;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"] {
  --bg: #0C1322; --card: #151F36; --ink: #EAF0FA; --ink-soft: #93A3C1; --line: #26334F;
  --brand: #EAF0FA; --brand-ink: #0C1322;
  --red: #FF7A8D; --red-bg: #3A1B28; --green: #3FDCA4; --green-bg: #11332B;
  --orange: #FFA94D; --orange-bg: #3A2614;
  --ticket: #1D2B4B; --ticket-ink: #F4F7FB; --ticket-soft: #9FB0D0;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 16px; line-height: 1.45;
}
h1, h2, h3, .num { font-family: "Bricolage Grotesque", "Figtree", system-ui, sans-serif; margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; border-radius: 8px; }
.wrap { max-width: 560px; margin: 0 auto; padding: 18px 16px 120px; }
.top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.top h1 { font-size: 22px; font-weight: 800; letter-spacing: -.01em; }
.sync { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-soft); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--green); }
.dot.off { background: #E0A100; }

.banner { background: var(--red-bg); color: var(--red); border-radius: 12px; padding: 10px 12px; font-size: 14px; margin-bottom: 12px; font-weight: 500; }
.banner.info { background: var(--card); color: var(--ink-soft); border: 1px solid var(--line); }

/* Ticket do Pix principal */
.ticket { background: var(--ticket); color: var(--ticket-ink); border-radius: 22px; position: relative; box-shadow: var(--shadow); margin-bottom: 22px; overflow: hidden; }
.ticket-top { padding: 18px 20px 16px; }
.ticket small { color: var(--ticket-soft); font-size: 13px; font-weight: 500; }
.payer-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 2px; }
.payer-name { font-size: 34px; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; }
.btn-ghost { background: rgba(255,255,255,.12); color: var(--ticket-ink); border: 0; border-radius: 999px; padding: 8px 14px; font-weight: 600; font-size: 14px; }
.btn-ghost:hover { background: rgba(255,255,255,.2); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.ticket .chips { margin-top: 12px; }
.chip { border: 1.5px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 8px 14px; font-weight: 600; font-size: 15px; }
.chip[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.ticket .chip { background: transparent; color: var(--ticket-ink); border-color: rgba(255,255,255,.3); }
.ticket .chip[aria-pressed="true"] { background: var(--ticket-ink); color: var(--ticket); border-color: var(--ticket-ink); }
.tear { position: relative; height: 0; border-top: 2px dashed rgba(255,255,255,.22); margin: 0 18px; }
.tear::before, .tear::after { content: ""; position: absolute; top: -13px; width: 24px; height: 24px; border-radius: 50%; background: var(--bg); }
.tear::before { left: -30px; } .tear::after { right: -30px; }
.ticket-bottom { padding: 16px 20px 18px; }
.pix-line { display: flex; gap: 8px; margin-top: 6px; }
.pix-line input { flex: 1; min-width: 0; background: rgba(255,255,255,.1); border: 1.5px solid rgba(255,255,255,.2); color: var(--ticket-ink); border-radius: 12px; padding: 11px 12px; font: inherit; font-size: 15px; }
.pix-line input::placeholder { color: var(--ticket-soft); }
.pix-line input:focus-visible { outline-color: var(--ticket-ink); }
.btn-copy { background: var(--ticket-ink); color: var(--ticket); border: 0; border-radius: 12px; padding: 0 16px; font-weight: 700; }
.totals { display: flex; gap: 22px; margin-top: 16px; }
.totals div { flex: 1; }
.totals .num { font-size: 22px; font-weight: 700; display: block; }

/* Lista de devedores */
.section-title { font-size: 18px; font-weight: 700; margin: 0 2px 10px; }
.person { background: var(--card); border-radius: 16px; margin-bottom: 10px; box-shadow: var(--shadow); border-left: 7px solid var(--line); overflow: hidden; }
.person.debt { border-left-color: var(--red); background: var(--red-bg); }
.person.credit { border-left-color: var(--orange); background: var(--orange-bg); }
.person.ok { border-left-color: var(--green); background: var(--green-bg); }
.person-head { width: 100%; display: flex; align-items: center; gap: 12px; padding: 14px 14px 14px 12px; background: none; border: 0; text-align: left; }
.avatar { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 17px; background: var(--card); color: var(--ink); flex: none; font-family: "Bricolage Grotesque", sans-serif; }
.pname { font-weight: 700; font-size: 17px; }
.pstatus { font-size: 14px; font-weight: 600; }
.debt .pstatus, .debt .amt { color: var(--red); }
.credit .pstatus, .credit .amt { color: var(--orange); }
.ok .pstatus, .ok .amt { color: var(--green); }
.grow { flex: 1; min-width: 0; }
.amt { font-family: "Bricolage Grotesque", sans-serif; font-size: 24px; font-weight: 800; white-space: nowrap; }
.chev { transition: transform .15s; color: var(--ink-soft); flex: none; }
.person.open .chev { transform: rotate(180deg); }
.detail { padding: 0 14px 14px; border-top: 1px dashed var(--line); }
.detail h3 { font-size: 14px; color: var(--ink-soft); font-weight: 600; margin: 12px 0 6px; font-family: "Figtree", sans-serif; }
.drow { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; font-size: 15px; }
.drow .neg { color: var(--red); font-weight: 700; } .drow .owe { color: var(--orange); font-weight: 700; }
.how { background: var(--card); border-radius: 12px; padding: 4px 12px 10px; margin-top: 10px; }
.how .drow { padding: 4px 0; font-size: 14px; }
.how .sum { border-top: 1.5px solid var(--line); margin-top: 4px; padding-top: 8px; font-weight: 800; font-size: 16px; }
.how .note { font-size: 13px; color: var(--ink-soft); margin-top: 6px; } .drow .pos { color: var(--green); font-weight: 700; }
.drow .x { background: none; border: 0; color: var(--ink-soft); padding: 0 6px; font-size: 16px; }
.btn { background: var(--brand); color: var(--brand-ink); border: 0; border-radius: 12px; padding: 12px 16px; font-weight: 700; font-size: 16px; }
.btn.block { width: 100%; margin-top: 12px; }
.btn.danger { background: transparent; color: var(--red); border: 1.5px solid var(--red); }
.btn.quiet { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }

/* Dias */
.day { background: var(--card); border-radius: 16px; box-shadow: var(--shadow); margin-bottom: 14px; overflow: hidden; }
.day-head { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 16px 8px; }
.day-head h3 { font-size: 19px; font-weight: 700; text-transform: capitalize-first; }
.day-head .num { font-size: 17px; font-weight: 700; color: var(--ink-soft); }
.exp { width: 100%; display: flex; justify-content: space-between; gap: 12px; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 12px 16px; }
.exp:hover { background: var(--bg); }
.exp .d { font-weight: 600; }
.exp .m { font-size: 13px; color: var(--ink-soft); }
.exp .v { text-align: right; white-space: nowrap; font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; font-size: 18px; }
.exp .v small { display: block; font-family: "Figtree", sans-serif; font-weight: 400; font-size: 12px; color: var(--ink-soft); }
.empty { text-align: center; color: var(--ink-soft); padding: 34px 16px; background: var(--card); border-radius: 16px; border: 1.5px dashed var(--line); }
.empty strong { display: block; color: var(--ink); font-size: 17px; margin-bottom: 4px; }

/* Barra inferior */
.bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line); padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 0px)); z-index: 20; }
.bar-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; }
.tab { background: none; border: 0; padding: 8px; border-radius: 12px; font-weight: 600; color: var(--ink-soft); font-size: 15px; }
.tab[aria-current="page"] { color: var(--ink); background: var(--bg); }
.fab { background: var(--brand); color: var(--brand-ink); border: 0; border-radius: 999px; padding: 13px 20px; font-weight: 800; font-size: 16px; box-shadow: var(--shadow); }

/* Sheet */
.overlay { position: fixed; inset: 0; background: rgba(8,14,28,.55); z-index: 40; display: none; align-items: flex-end; justify-content: center; }
.overlay.show { display: flex; }
.sheet { background: var(--card); width: 100%; max-width: 560px; border-radius: 22px 22px 0 0; padding: 18px 18px calc(18px + env(safe-area-inset-bottom, 0px)); max-height: 92%; overflow-y: auto; }
@media (min-width: 600px) { .overlay { align-items: center; } .sheet { border-radius: 22px; } }
.sheet h2 { font-size: 22px; font-weight: 800; margin-bottom: 14px; }
label.f { display: block; font-weight: 600; font-size: 14px; margin: 14px 0 6px; color: var(--ink-soft); }
.sheet input[type=text], .sheet input[type=date], .sheet input[inputmode] { width: 100%; background: var(--bg); color: var(--ink); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px; font: inherit; font-size: 17px; }
.money { position: relative; }
.money span { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-weight: 700; color: var(--ink-soft); }
.money input { padding-left: 44px !important; font-size: 22px !important; font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; }
.row2 { display: flex; gap: 10px; margin-top: 16px; }
.row2 .btn { flex: 1; }
.hint { font-size: 13px; color: var(--ink-soft); margin-top: 6px; }
.err { color: var(--red); font-size: 14px; font-weight: 600; margin-top: 10px; min-height: 1em; }
.toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--brand); color: var(--brand-ink); padding: 10px 16px; border-radius: 999px; font-weight: 600; z-index: 60; opacity: 0; pointer-events: none; transition: opacity .2s; max-width: 90%; text-align: center; }
.toast.show { opacity: 1; }
.hidden { display: none !important; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>Contas da viagem</h1>
    <div class="sync" id="sync"><span class="dot off"></span><span>Carregando…</span></div>
  </div>
  <div id="banner"></div>

  <main id="view-resumo">
    <section class="ticket" aria-label="Pix principal">
      <div class="ticket-top">
        <small>Quem fez o Pix principal</small>
        <div class="payer-row">
          <div class="payer-name" id="payerName">Luiza</div>
          <button class="btn-ghost" id="payerChange" type="button" aria-expanded="false">Trocar</button>
        </div>
        <div class="chips hidden" id="payerChips"></div>
      </div>
      <div class="tear" aria-hidden="true"></div>
      <div class="ticket-bottom">
        <small><label for="pixInput" id="pixLabel">Chave Pix (para o grupo mandar o dinheiro)</label></small>
        <div class="pix-line">
          <input id="pixInput" type="text" autocomplete="off" placeholder="CPF, e-mail, telefone ou chave aleatória" enterkeyhint="done">
          <button class="btn-copy" id="pixCopy" type="button">Copiar</button>
        </div>
        <div class="totals">
          <div><small>Total gasto</small><span class="num" id="totalGasto">R$ 0,00</span></div>
          <div><small>Falta receber</small><span class="num" id="totalFalta">R$ 0,00</span></div>
        </div>
      </div>
    </section>

    <h2 class="section-title" id="debtTitle">Quem deve</h2>
    <div id="debtList"></div>
  </main>

  <main id="view-dias" class="hidden">
    <h2 class="section-title">Gastos por dia</h2>
    <div id="daysList"></div>
  </main>
</div>

<nav class="bar" aria-label="Navegação">
  <div class="bar-in">
    <button class="tab" id="tabResumo" aria-current="page" type="button">Resumo</button>
    <button class="fab" id="fabAdd" type="button">+ Gasto</button>
    <button class="tab" id="tabDias" type="button">Por dia</button>
  </div>
</nav>

<!-- Sheet: gasto -->
<div class="overlay" id="ovExpense" role="dialog" aria-modal="true" aria-labelledby="expTitle">
  <div class="sheet">
    <h2 id="expTitle">Novo gasto</h2>
    <label class="f" for="expDesc">O que foi?</label>
    <input type="text" id="expDesc" placeholder="Ex.: Uber para o hotel" autocomplete="off">
    <label class="f" for="expValue">Valor</label>
    <div class="money"><span>R$</span><input type="text" id="expValue" inputmode="decimal" placeholder="0,00" autocomplete="off"></div>
    <label class="f" for="expDay">Dia</label>
    <input type="date" id="expDay">
    <label class="f">Quem pagou?</label>
    <div class="chips" id="expPayer"></div>
    <label class="f">Dividir entre quem?</label>
    <div class="chips" id="expSplit"></div>
    <div class="hint" id="expHint"></div>
    <div class="err" id="expErr" role="alert"></div>
    <div class="row2">
      <button class="btn quiet" id="expCancel" type="button">Cancelar</button>
      <button class="btn" id="expSave" type="button">Salvar gasto</button>
    </div>
    <div class="row2"><button class="btn danger hidden" id="expDelete" type="button">Excluir gasto</button></div>
  </div>
</div>

<!-- Sheet: pagamento -->
<div class="overlay" id="ovPay" role="dialog" aria-modal="true" aria-labelledby="payTitle">
  <div class="sheet">
    <h2 id="payTitle">Registrar pagamento</h2>
    <div class="hint" id="payWho"></div>
    <label class="f" for="payValue">Valor</label>
    <div class="money"><span>R$</span><input type="text" id="payValue" inputmode="decimal" placeholder="0,00" autocomplete="off"></div>
    <div class="hint">Já vem com o valor que falta. Se foi só uma parte, altere.</div>
    <div class="err" id="payErr" role="alert"></div>
    <div class="row2">
      <button class="btn quiet" id="payCancel" type="button">Cancelar</button>
      <button class="btn" id="paySave" type="button">Registrar pagamento</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  "use strict";
  var PEOPLE = ["Luiza", "Maria", "Luana", "Carla", "João"];
  var LS_KEY = "contas-viagem-v1";
  var $ = function (id) { return document.getElementById(id); };

  var S = { config: { mainPayer: "Luiza", pixes: {} }, expenses: [], payments: [] };
  function cleanPixes(d) {
    var out = {};
    var src = (d && d.pixes && typeof d.pixes === "object") ? d.pixes : {};
    PEOPLE.forEach(function (p) { out[p] = String(src[p] || ""); });
    // migração: chave única antiga vira a chave de quem era o pagador principal
    if (d && d.pix && !out[validPerson(d.mainPayer) ? d.mainPayer : "Luiza"]) {
      out[validPerson(d.mainPayer) ? d.mainPayer : "Luiza"] = String(d.pix);
    }
    return out;
  }
  function parseConfig(d) {
    d = d || {};
    return { mainPayer: validPerson(d.mainPayer) ? d.mainPayer : "Luiza", pixes: cleanPixes(d) };
  }
  var mode = "loading"; // loading | shared | local
  var readOnly = false;
  var db = null;
  var expanded = {};
  var editingId = null;
  var payTarget = null;
  var expPayerSel = "Luiza", expSplitSel = PEOPLE.slice();

  /* ---------- utilidades ---------- */
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function brl(cents) {
    var v = (cents || 0) / 100;
    try { return v.toLocaleString("pt-BR", { style: "currency", currency: "BRL" }); }
    catch (e) { return "R$ " + v.toFixed(2).replace(".", ","); }
  }
  function parseMoney(str) {
    var s = String(str || "").replace(/R\$|\s/g, "");
    if (!s) return NaN;
    if (s.indexOf(",") > -1) s = s.replace(/\./g, "").replace(",", ".");
    var n = parseFloat(s);
    return isFinite(n) ? Math.round(n * 100) : NaN;
  }
  function todayKey() {
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function dayLabel(key) {
    var p = String(key).split("-");
    if (p.length !== 3) return key;
    var d = new Date(+p[0], +p[1] - 1, +p[2]);
    var txt;
    try {
      var wd = d.toLocaleDateString("pt-BR", { weekday: "long" });
      var dm = d.toLocaleDateString("pt-BR", { day: "numeric", month: "long" });
      txt = dm + " (" + wd + ")";
    } catch (e) { txt = key; }
    return txt;
  }
  function shortDate(key) {
    var p = String(key).split("-");
    return p.length === 3 ? p[2] + "/" + p[1] : key;
  }
  function toast(msg) {
    var t = $("toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove("show"); }, 2200);
  }
  function validPerson(p) { return PEOPLE.indexOf(p) > -1; }

  /* ---------- cálculo ---------- */
  function shares(e) {
    var list = PEOPLE.filter(function (p) { return (e.split || []).indexOf(p) > -1; });
    var out = {};
    if (!list.length) return out;
    var base = Math.floor(e.cents / list.length);
    var rem = e.cents - base * list.length;
    list.forEach(function (p, i) { out[p] = base + (i < rem ? 1 : 0); });
    return out;
  }
  // Conta individual entre cada pessoa e o pagador principal (sem misturar com os outros).
  // bal[p] > 0: o principal deve a p. bal[p] < 0: p deve ao principal.
  function compute() {
    var main = S.config.mainPayer;
    var bal = {}, perDay = {}, total = 0, det = {};
    PEOPLE.forEach(function (p) { bal[p] = 0; det[p] = { owes: 0, owed: 0, paidIn: 0, paidOut: 0 }; });
    function day(k) { if (!perDay[k]) { perDay[k] = {}; PEOPLE.forEach(function (p) { perDay[k][p] = 0; }); } return perDay[k]; }
    S.expenses.forEach(function (e) {
      if (!validPerson(e.payer) || !(e.cents > 0)) return;
      total += e.cents;
      var sh = shares(e);
      var d = day(e.day);
      if (e.payer === main) {
        // o principal pagou: cada participante deve a parte dele ao principal
        Object.keys(sh).forEach(function (p) {
          if (p === main) return;
          bal[p] -= sh[p]; d[p] -= sh[p]; det[p].owes += sh[p];
        });
      } else if (sh[main]) {
        // outra pessoa pagou e o principal participou: o principal deve a parte dele a quem pagou
        bal[e.payer] += sh[main]; d[e.payer] += sh[main]; det[e.payer].owed += sh[main];
      }
    });
    S.payments.forEach(function (x) {
      if (!validPerson(x.from) || !validPerson(x.to) || !(x.cents > 0)) return;
      if (x.to === main && x.from !== main) { bal[x.from] += x.cents; det[x.from].paidIn += x.cents; }
      else if (x.from === main && x.to !== main) { bal[x.to] -= x.cents; det[x.to].paidOut += x.cents; }
    });
    return { bal: bal, perDay: perDay, total: total, det: det };
  }

  /* ---------- persistência ---------- */
  var queue = Promise.resolve();
  function enqueue(fn) { queue = queue.then(fn).catch(function (err) { handleWriteError(err); }); return queue; }
  function handleWriteError(err) {
    if (err && (err.code === "invalid_argument" || err.code === "revoked")) {
      readOnly = true; renderBanner();
      toast("Sem permissão para editar. Peça acesso de colaborador.");
    } else { toast("Não foi possível salvar. Tente de novo."); }
  }
  function saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {} }
  function loadLocal() {
    try {
      var raw = localStorage.getItem(LS_KEY);
      if (raw) {
        var o = JSON.parse(raw);
        if (o && o.config) S.config = parseConfig(o.config);
        if (o && Array.isArray(o.expenses)) S.expenses = o.expenses;
        if (o && Array.isArray(o.payments)) S.payments = o.payments;
      }
    } catch (e) {}
  }
  function newId() { return "i" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  function writeConfig() {
    var data = { mainPayer: S.config.mainPayer, pixes: S.config.pixes };
    if (mode === "shared") return enqueue(function () { return db.doc("config/main").set(data); });
    saveLocal(); return Promise.resolve();
  }
  // Atualiza a tela na hora (também no modo compartilhado) e depois grava.
  function writeExpense(id, data) {
    data.id = id;
    var i = S.expenses.findIndex(function (x) { return x.id === id; });
    if (i > -1) S.expenses[i] = data; else S.expenses.push(data);
    renderAll();
    if (mode === "shared") return enqueue(function () { return db.collection("expenses").doc(id).set(data); });
    saveLocal(); return Promise.resolve();
  }
  function removeExpense(id) {
    S.expenses = S.expenses.filter(function (x) { return x.id !== id; });
    renderAll();
    if (mode === "shared") return enqueue(function () { return db.collection("expenses").doc(id).delete(); });
    saveLocal(); return Promise.resolve();
  }
  function writePayment(id, data) {
    data.id = id;
    S.payments.push(data);
    renderAll();
    if (mode === "shared") return enqueue(function () { return db.collection("payments").doc(id).set(data); });
    saveLocal(); return Promise.resolve();
  }
  function removePayment(id) {
    S.payments = S.payments.filter(function (x) { return x.id !== id; });
    renderAll();
    if (mode === "shared") return enqueue(function () { return db.collection("payments").doc(id).delete(); });
    saveLocal(); return Promise.resolve();
  }
  function guardWrite() {
    if (readOnly) { toast("Você só pode ver. Peça acesso de colaborador."); return false; }
    return true;
  }

  /* ---------- render ---------- */
  function renderSync() {
    var el = $("sync");
    if (mode === "shared") el.innerHTML = '<span class="dot"></span><span>Compartilhado com o grupo</span>';
    else if (mode === "local") el.innerHTML = '';
    else el.innerHTML = '<span class="dot off"></span><span>Carregando…</span>';
  }
  function renderBanner() {
    var b = $("banner"), html = "";
    if (readOnly) html = '<div class="banner">Você está só visualizando. Peça para quem criou o site te dar acesso de colaborador para lançar gastos.</div>';
    b.innerHTML = html;
  }
  function renderHero(c) {
    var main = S.config.mainPayer;
    $("payerName").textContent = main;
    var chips = $("payerChips");
    chips.innerHTML = PEOPLE.map(function (p) {
      return '<button type="button" class="chip" data-payer="' + esc(p) + '" aria-pressed="' + (p === main) + '">' + esc(p) + '</button>';
    }).join("");
    var pix = $("pixInput");
    if (document.activeElement !== pix) pix.value = S.config.pixes[main] || "";
    $("pixLabel").textContent = "Chave Pix de " + main + " (para o grupo mandar o dinheiro)";
    $("totalGasto").textContent = brl(c.total);
    var falta = 0;
    PEOPLE.forEach(function (p) { if (p !== main && c.bal[p] < 0) falta += -c.bal[p]; });
    $("totalFalta").textContent = brl(falta);
    $("debtTitle").textContent = "Contas com " + main;
  }
  function renderDebts(c) {
    var main = S.config.mainPayer;
    var others = PEOPLE.filter(function (p) { return p !== main; });
    if (mode === "loading") { $("debtList").innerHTML = '<div class="empty">Carregando…</div>'; return; }
    var html = others.map(function (p) {
      var b = c.bal[p], cls, status, amount;
      if (b < 0) { cls = "debt"; status = "Deve a " + main; amount = brl(-b); }
      else if (b > 0) { cls = "credit"; status = main + " deve a " + p; amount = brl(b); }
      else { cls = "ok"; status = "Quitado"; amount = brl(0); }
      var open = !!expanded[p];
      var h = '<div class="person ' + cls + (open ? " open" : "") + '">' +
        '<button type="button" class="person-head" data-toggle="' + esc(p) + '" aria-expanded="' + open + '">' +
        '<span class="avatar" aria-hidden="true">' + esc(p.charAt(0)) + '</span>' +
        '<span class="grow"><span class="pname">' + esc(p) + '</span><br><span class="pstatus">' + esc(status) + '</span></span>' +
        '<span class="amt">' + amount + '</span>' +
        '<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>' +
        '</button>';
      if (open) h += detailHtml(p, c, b, main);
      return h + "</div>";
    }).join("");
    $("debtList").innerHTML = html;
  }
  function detailHtml(p, c, b, main) {
    var days = Object.keys(c.perDay).sort().reverse().filter(function (k) { return c.perDay[k][p] !== 0; });
    var h = '<div class="detail">';
    h += "<h3>Resultado de cada dia</h3>";
    if (!days.length) h += '<div class="drow"><span>Nenhum gasto ainda.</span></div>';
    days.forEach(function (k) {
      var v = c.perDay[k][p];
      h += '<div class="drow"><span>' + esc(dayLabel(k)) + '</span><span class="' + (v < 0 ? "neg" : "owe") + '">' + (v < 0 ? esc(p) + " deve " + brl(-v) : esc(main) + " deve " + brl(v)) + "</span></div>";
    });
    var dt = c.det[p];
    if (dt.owes || dt.owed || dt.paidIn || dt.paidOut) {
      h += "<h3>Como chegamos nesse valor</h3><div class=\"how\">";
      if (dt.owes) h += '<div class="drow"><span>' + esc(p) + " deve a " + esc(main) + " (gastos que " + esc(main) + " pagou)</span><span class=\"neg\">" + brl(dt.owes) + "</span></div>";
      if (dt.owed) h += '<div class="drow"><span>' + esc(main) + " deve a " + esc(p) + " (gastos que " + esc(p) + " pagou)</span><span class=\"owe\">− " + brl(dt.owed) + "</span></div>";
      if (dt.paidIn) h += '<div class="drow"><span>' + esc(p) + " já pagou a " + esc(main) + '</span><span class="pos">− ' + brl(dt.paidIn) + "</span></div>";
      if (dt.paidOut) h += '<div class="drow"><span>' + esc(main) + " já pagou a " + esc(p) + '</span><span class="owe">+ ' + brl(dt.paidOut) + "</span></div>";
      var resText = b < 0 ? esc(p) + " ainda deve " + brl(-b) + " a " + esc(main) : (b > 0 ? esc(main) + " ainda deve " + brl(b) + " a " + esc(p) : "Tudo quitado");
      h += '<div class="drow sum"><span>Resta</span><span class="' + (b < 0 ? "neg" : (b > 0 ? "owe" : "pos")) + '">' + resText + "</span></div>";
      if (dt.owes && dt.owed) h += '<div class="note">As duas dívidas se compensam: só a diferença precisa ser paga.</div>';
      h += "</div>";
    }
    var pays = S.payments.filter(function (x) { return (x.from === p && x.to === main) || (x.to === p && x.from === main); })
      .sort(function (a, b2) { return String(b2.day).localeCompare(String(a.day)); });
    if (pays.length) {
      h += "<h3>Pagamentos já feitos</h3>";
      pays.forEach(function (x) {
        var txt = x.from === p ? "Pagou " + brl(x.cents) + " a " + esc(x.to) : "Recebeu " + brl(x.cents) + " de " + esc(x.from);
        h += '<div class="drow"><span class="pos">' + txt + " em " + esc(shortDate(x.day)) + '</span><button class="x" type="button" data-delpay="' + esc(x.id) + '" aria-label="Apagar pagamento">✕</button></div>';
      });
    }
    if (b < 0) h += '<button class="btn block" type="button" data-pay="' + esc(p) + '" data-dir="in">Registrar pagamento de ' + esc(p) + "</button>";
    else if (b > 0) h += '<button class="btn block" type="button" data-pay="' + esc(p) + '" data-dir="out">Registrar que ' + esc(main) + " pagou " + esc(p) + "</button>";
    return h + "</div>";
  }
  function renderDays() {
    if (mode === "loading") { $("daysList").innerHTML = '<div class="empty">Carregando…</div>'; return; }
    var groups = {};
    S.expenses.forEach(function (e) { if (!validPerson(e.payer) || !(e.cents > 0)) return; (groups[e.day] = groups[e.day] || []).push(e); });
    var keys = Object.keys(groups).sort().reverse();
    if (!keys.length) {
      $("daysList").innerHTML = '<div class="empty"><strong>Nenhum gasto ainda</strong>Toque em “+ Gasto” para lançar o primeiro.</div>';
      return;
    }
    $("daysList").innerHTML = keys.map(function (k) {
      var list = groups[k].sort(function (a, b) { return (b.ts || 0) - (a.ts || 0); });
      var tot = list.reduce(function (s, e) { return s + e.cents; }, 0);
      var h = '<section class="day"><div class="day-head"><h3>' + esc(dayLabel(k)) + '</h3><span class="num">' + brl(tot) + "</span></div>";
      list.forEach(function (e) {
        var n = (e.split || []).filter(validPerson).length;
        var all = n === PEOPLE.length;
        var who = all ? "todos" : (e.split || []).filter(validPerson).join(", ");
        var each = n ? brl(Math.round(e.cents / n)) + " cada" : "";
        h += '<button class="exp" type="button" data-edit="' + esc(e.id) + '"><span><span class="d">' + esc(e.desc || "Gasto") + '</span><br><span class="m">' + esc(e.payer) + " pagou, dividido com " + esc(who) + '</span></span><span class="v">' + brl(e.cents) + "<small>" + each + "</small></span></button>";
      });
      return h + "</section>";
    }).join("");
  }
  function renderAll() {
    var c = compute();
    renderSync(); renderBanner(); renderHero(c); renderDebts(c); renderDays();
  }

  /* ---------- sheets ---------- */
  function openSheet(id) { $(id).classList.add("show"); }
  function closeSheet(id) { $(id).classList.remove("show"); }
  function chipHtml(list, selected, attr) {
    return list.map(function (p) {
      return '<button type="button" class="chip" ' + attr + '="' + esc(p) + '" aria-pressed="' + (selected.indexOf(p) > -1) + '">' + esc(p) + "</button>";
    }).join("");
  }
  function renderExpChips() {
    $("expPayer").innerHTML = chipHtml(PEOPLE, [expPayerSel], "data-ep");
    $("expSplit").innerHTML = chipHtml(PEOPLE, expSplitSel, "data-es") +
      '<button type="button" class="chip" data-es-all="1" aria-pressed="' + (expSplitSel.length === PEOPLE.length) + '">Todos</button>';
    updateHint();
  }
  function updateHint() {
    var cents = parseMoney($("expValue").value);
    var n = expSplitSel.length;
    $("expHint").textContent = (cents > 0 && n) ? "Cada pessoa paga cerca de " + brl(Math.round(cents / n)) + "." : "";
  }
  function openExpense(id) {
    if (!guardWrite()) return;
    editingId = id || null;
    var e = id ? S.expenses.find(function (x) { return x.id === id; }) : null;
    $("expTitle").textContent = e ? "Editar gasto" : "Novo gasto";
    $("expDesc").value = e ? (e.desc || "") : "";
    $("expValue").value = e ? (e.cents / 100).toFixed(2).replace(".", ",") : "";
    $("expDay").value = e ? e.day : todayKey();
    expPayerSel = e && validPerson(e.payer) ? e.payer : S.config.mainPayer;
    expSplitSel = e ? PEOPLE.filter(function (p) { return (e.split || []).indexOf(p) > -1; }) : PEOPLE.slice();
    $("expErr").textContent = "";
    $("expDelete").classList.toggle("hidden", !e);
    renderExpChips(); openSheet("ovExpense");
    setTimeout(function () { $("expDesc").focus(); }, 50);
  }
  function saveExpense() {
    var desc = $("expDesc").value.trim();
    var cents = parseMoney($("expValue").value);
    var day = $("expDay").value;
    if (!(cents > 0)) { $("expErr").textContent = "Digite o valor do gasto."; return; }
    if (!expSplitSel.length) { $("expErr").textContent = "Escolha pelo menos uma pessoa para dividir."; return; }
    if (!day) { $("expErr").textContent = "Escolha o dia."; return; }
    var id = editingId || newId();
    var old = editingId ? S.expenses.find(function (x) { return x.id === id; }) : null;
    var data = { desc: desc || "Gasto", cents: cents, day: day, payer: expPayerSel, split: PEOPLE.filter(function (p) { return expSplitSel.indexOf(p) > -1; }), ts: old && old.ts ? old.ts : Date.now() };
    closeSheet("ovExpense");
    writeExpense(id, data).then(function () { toast("Gasto salvo"); });
  }
  function openPay(person, dir) {
    if (!guardWrite()) return;
    var c = compute(), b = c.bal[person], main = S.config.mainPayer;
    payTarget = { person: person, dir: dir };
    var amount = Math.abs(b);
    $("payWho").textContent = dir === "in" ? person + " manda para " + main : main + " manda para " + person;
    $("payValue").value = (amount / 100).toFixed(2).replace(".", ",");
    $("payErr").textContent = "";
    openSheet("ovPay");
    setTimeout(function () { $("payValue").select(); }, 50);
  }
  function savePay() {
    var cents = parseMoney($("payValue").value);
    if (!(cents > 0)) { $("payErr").textContent = "Digite o valor pago."; return; }
    var main = S.config.mainPayer, t = payTarget;
    var data = { from: t.dir === "in" ? t.person : main, to: t.dir === "in" ? main : t.person, cents: cents, day: todayKey(), ts: Date.now() };
    closeSheet("ovPay");
    writePayment(newId(), data).then(function () { toast("Pagamento registrado"); });
  }

  /* ---------- eventos ---------- */
  function showTab(name) {
    $("view-resumo").classList.toggle("hidden", name !== "resumo");
    $("view-dias").classList.toggle("hidden", name !== "dias");
    $("tabResumo").setAttribute("aria-current", name === "resumo" ? "page" : "false");
    $("tabDias").setAttribute("aria-current", name === "dias" ? "page" : "false");
    window.scrollTo(0, 0);
  }
  $("tabResumo").addEventListener("click", function () { showTab("resumo"); });
  $("tabDias").addEventListener("click", function () { showTab("dias"); });
  $("fabAdd").addEventListener("click", function () { openExpense(null); });

  $("payerChange").addEventListener("click", function () {
    var ch = $("payerChips"), hide = !ch.classList.contains("hidden");
    ch.classList.toggle("hidden", hide);
    $("payerChange").setAttribute("aria-expanded", String(!hide));
    $("payerChange").textContent = hide ? "Trocar" : "Fechar";
  });
  $("payerChips").addEventListener("click", function (ev) {
    var b = ev.target.closest("[data-payer]"); if (!b) return;
    if (!guardWrite()) return;
    S.config.mainPayer = b.getAttribute("data-payer");
    $("payerChips").classList.add("hidden");
    $("payerChange").textContent = "Trocar"; $("payerChange").setAttribute("aria-expanded", "false");
    renderAll(); writeConfig();
  });
  function commitPix() {
    var v = $("pixInput").value.trim(), main = S.config.mainPayer;
    if (v === (S.config.pixes[main] || "")) return;
    if (!guardWrite()) { $("pixInput").value = S.config.pixes[main] || ""; return; }
    S.config.pixes[main] = v; writeConfig().then(function () { toast("Chave Pix de " + main + " salva"); });
  }
  $("pixInput").addEventListener("change", commitPix);
  $("pixInput").addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); $("pixInput").blur(); } });
  $("pixCopy").addEventListener("click", function () {
    var v = $("pixInput").value.trim();
    if (!v) { toast("Digite a chave Pix primeiro"); $("pixInput").focus(); return; }
    function fallback() {
      try { $("pixInput").select(); document.execCommand("copy"); toast("Chave copiada"); }
      catch (e) { toast("Selecione e copie a chave manualmente"); }
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(v).then(function () { toast("Chave copiada"); }, fallback);
    } else fallback();
  });

  $("debtList").addEventListener("click", function (ev) {
    var t = ev.target.closest("[data-toggle]");
    if (t) { var p = t.getAttribute("data-toggle"); expanded[p] = !expanded[p]; renderAll(); return; }
    var pay = ev.target.closest("[data-pay]");
    if (pay) { openPay(pay.getAttribute("data-pay"), pay.getAttribute("data-dir")); return; }
    var del = ev.target.closest("[data-delpay]");
    if (del && guardWrite() && confirm("Apagar este pagamento?")) removePayment(del.getAttribute("data-delpay"));
  });
  $("daysList").addEventListener("click", function (ev) {
    var b = ev.target.closest("[data-edit]"); if (b) openExpense(b.getAttribute("data-edit"));
  });

  $("expPayer").addEventListener("click", function (ev) {
    var b = ev.target.closest("[data-ep]"); if (!b) return;
    expPayerSel = b.getAttribute("data-ep"); renderExpChips();
  });
  $("expSplit").addEventListener("click", function (ev) {
    var a = ev.target.closest("[data-es-all]");
    if (a) { expSplitSel = expSplitSel.length === PEOPLE.length ? [] : PEOPLE.slice(); renderExpChips(); return; }
    var b = ev.target.closest("[data-es]"); if (!b) return;
    var p = b.getAttribute("data-es"), i = expSplitSel.indexOf(p);
    if (i > -1) expSplitSel.splice(i, 1); else expSplitSel.push(p);
    renderExpChips();
  });
  $("expValue").addEventListener("input", updateHint);
  $("expCancel").addEventListener("click", function () { closeSheet("ovExpense"); });
  $("expSave").addEventListener("click", saveExpense);
  $("expDelete").addEventListener("click", function () {
    if (editingId && confirm("Excluir este gasto?")) { var id = editingId; closeSheet("ovExpense"); removeExpense(id).then(function () { toast("Gasto excluído"); }); }
  });
  $("payCancel").addEventListener("click", function () { closeSheet("ovPay"); });
  $("paySave").addEventListener("click", savePay);
  ["ovExpense", "ovPay"].forEach(function (id) {
    $(id).addEventListener("click", function (ev) { if (ev.target === $(id)) closeSheet(id); });
  });
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape") { closeSheet("ovExpense"); closeSheet("ovPay"); }
  });

  /* ---------- inicialização ---------- */
  function startLocal() {
    mode = "local"; loadLocal(); renderAll();
  }
  function docsToList(snap) {
    return snap.docs.map(function (d) { var o = d.data() || {}; o.id = d.id; return o; });
  }
  function startShared(dbNs, userNs) {
    db = dbNs; mode = "shared";
    if (userNs && typeof userNs.can === "function") {
      userNs.can("data.write").then(function (ok) { if (ok === false) { readOnly = true; renderAll(); } }, function () {});
    }
    db.doc("config/main").onSnapshot(function (snap) {
      if (snap.exists) {
        S.config = parseConfig(snap.data());
      }
      renderAll();
    }, function () {});
    db.collection("expenses").onSnapshot(function (snap) {
      S.expenses = docsToList(snap).filter(function (e) { return typeof e.cents === "number"; });
      renderAll();
    }, function () {});
    db.collection("payments").onSnapshot(function (snap) {
      S.payments = docsToList(snap).filter(function (e) { return typeof e.cents === "number"; });
      renderAll();
    }, function () {});
    renderAll();
  }

  renderAll();
  if (window.claude && typeof window.claude.use === "function") {
    Promise.all([window.claude.use("db"), window.claude.use("user")]).then(function (r) {
      if (r[0]) startShared(r[0], r[1]); else startLocal();
    }, startLocal);
  } else {
    startLocal();
  }
})();
</script>
</body>
</html>
